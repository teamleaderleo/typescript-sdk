name: Fieldwork reconnect probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/client/src/client/streamableHttp.ts'
      - 'packages/client/test/client/streamableHttp.reconnectProbe.test.ts'
      - '.github/workflows/fieldwork-reconnect-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnect-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modelcontextprotocol/client test -- streamableHttp.reconnectProbe.test.ts
